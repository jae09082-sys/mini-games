<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온라인 테트리스</title><link rel="stylesheet" href="style.css"></head><body><main class="game-shell tetris-shell"><a class="back" href="index.html">← 게임 메뉴</a><header><p class="eyebrow">ONLINE BATTLE · UP TO 4</p><h1>테트리스 배틀 🧱</h1><p class="subtitle">방 코드를 공유해 친구와 겨뤄보세요.</p></header><section class="room"><input id="room" maxlength="6" placeholder="방 코드 6자리"><button id="host" class="primary">방 만들기</button><button id="join">참가</button><small id="net">혼자 연습 중 · 방을 만들면 친구가 참가할 수 있어요.</small></section><section class="tetris-layout"><canvas id="tetris" width="300" height="600" aria-label="테트리스 보드"></canvas><aside><strong>점수 <b id="score">0</b></strong><strong>상대 <b id="players">0/4</b></strong><p id="tmsg">줄을 지워 상대에게 방해 줄을 보내세요!</p></aside></section><div class="touch"><button data-key="left">◀</button><button data-key="rotate">↻</button><button data-key="right">▶</button><button data-key="down">▼</button><button data-key="drop">⤓</button></div><p class="help">PC: ← → 이동 · ↑ 회전 · ↓ 내리기 · Space 즉시 내리기</p></main><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="tetris.js"></script></body></html>
