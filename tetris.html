<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>테트리스 배틀</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="online.css"></head><body><main class="game-shell tetris-shell"><a class="back" href="index.html">← 게임 메뉴</a><h1>테트리스 배틀 🧱</h1>
<label>플레이어 이름<input id="name" maxlength="12" placeholder="이름"></label>
<section class="room"><input id="room" maxlength="6" placeholder="방 코드 6자리"><button id="host">방 만들기</button><button id="join">참가</button><small id="net" role="status">온라인 연결 준비 중</small></section>
<div class="actions"><button id="start" disabled>배틀 시작 / 재대결</button><button id="leave" disabled>방 나가기</button><button id="practice">혼자 연습</button></div><p id="tmsg" role="status">연습 또는 방 만들기를 선택하세요.</p>
<section class="tetris-layout"><canvas id="tetris" width="300" height="600" aria-label="내 보드"></canvas><aside><strong>다음 블록</strong><canvas id="next" width="120" height="90" aria-label="다음 블록"></canvas><strong>점수 <b id="score">0</b></strong><strong>참가자 <b id="players">0/4</b></strong></aside></section>
<div class="touch"><button data-key="left">◀</button><button data-key="rotate">↻</button><button data-key="right">▶</button><button data-key="down">▼</button><button data-key="drop">⤓</button></div><p class="help">← → 이동 · ↑ 회전 · ↓ 내리기 · Space 즉시 내리기<br>이동 버튼 길게 누르기 지원 · 2/3/4줄 제거 시 1/2/4줄 공격</p><section id="opponents" aria-label="상대 화면"></section><section id="ranking"></section></main><script type="module" src="tetris.js"></script></body></html>
