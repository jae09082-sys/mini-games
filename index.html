<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <p class="eyebrow">CLASSIC PUZZLE</p>
        <h1>지뢰찾기 <span aria-hidden="true">💣</span></h1>
        <p class="subtitle">지뢰를 피해 모든 안전한 칸을 열어보세요.</p>
      </header>

      <section class="controls" aria-label="게임 설정">
        <label>난이도
          <select id="difficulty">
            <option value="easy">쉬움 · 9 × 9 · 지뢰 10개</option>
            <option value="medium">보통 · 12 × 12 · 지뢰 22개</option>
            <option value="hard">어려움 · 16 × 16 · 지뢰 40개</option>
          </select>
        </label>
        <button id="new-game" class="primary">새 게임</button>
      </section>

      <section class="status" aria-live="polite">
        <div><span>남은 지뢰</span><strong id="mine-count">010</strong></div>
        <button id="face" class="face" aria-label="새 게임 시작">🙂</button>
        <div><span>시간</span><strong id="timer">000</strong></div>
      </section>

      <div id="board" class="board" role="grid" aria-label="지뢰찾기 게임판"></div>
      <p id="message" class="message">첫 칸은 항상 안전합니다.</p>
      <p class="help">클릭: 칸 열기 · 오른쪽 클릭 또는 길게 누르기: 깃발 표시</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
